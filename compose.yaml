services:
  postgres:
    image: postgres:18-alpine
    container_name: orders-postgres
    environment:
      POSTGRES_DB: orders_solid
      POSTGRES_USER: andrey
      POSTGRES_PASSWORD: adm123
    ports:
      - "5432:5432"
    volumes:
      - orders-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andrey -d orders_solid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orders-pgdata:
